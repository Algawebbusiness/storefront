name: CI

# SECURITY/QUALITY GATE: runs on every PR (and pushes to main) so type errors,
# failing tests, and lint violations cannot merge. The existing lint.yml only
# runs post-deployment, which is too late. Mark this workflow's jobs as required
# status checks in branch protection.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Needed by graphql-codegen (generate:all) to resolve the schema.
      NEXT_PUBLIC_SALEOR_API_URL: https://storefront1.saleor.cloud/graphql/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated GraphQL types are required for typecheck/lint/tests.
      - name: Generate GraphQL types
        run: pnpm run generate:all

      # MCP Apps single-file bundles (src/mcp-apps/dist/, gitignored) — the
      # serve-html tests assert these exist.
      - name: Build MCP Apps bundles
        run: pnpm run build:mcp-apps

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run
